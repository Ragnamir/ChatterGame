# Локальный Postgres для разработки и прогона гейта.
#
# Образ зафиксирован на версии 16 — это подтверждённая версия стека (D-092).
# Профиль только включает сервис: состав у dev и prod одинаков. Окружения разделяются
# именем проекта compose, потому что от него зависят имена тома и сети, и своим `.env`:
#
#   docker compose -p chattergame-dev  --profile dev  up -d
#   docker compose -p chattergame-prod --profile prod up -d
#
# Порт и имя базы задаются в `.env` (`CHATTERGAME_DB_PORT`, `CHATTERGAME_DB_NAME`).
services:
  postgres:
    image: postgres:16
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${CHATTERGAME_DB_NAME:-chattergame}
      POSTGRES_USER: ${CHATTERGAME_DB_USER:-chattergame}
      POSTGRES_PASSWORD: ${CHATTERGAME_DB_PASSWORD:-chattergame}
    ports:
      - "${CHATTERGAME_DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CHATTERGAME_DB_USER:-chattergame} -d ${CHATTERGAME_DB_NAME:-chattergame}
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
