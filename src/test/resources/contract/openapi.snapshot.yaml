openapi: 3.1.0
info:
  title: ChatterGame API
  version: 0.1.0
  description: |
    Контур API. На E02 зафиксированы пользователь и локальная аутентификация: регистрация,
    вход, сессия в HttpOnly cookie, профиль, сброс пароля, ключи LLM и удаление аккаунта.
    На E03 добавлены игры: создание, чтение, переходы состояния и аудит-чтение журнала.
    Пути идут без префикса `/api`: так они записаны в `PLAN` (`GET /me`, `GET /games/{id}/events`).

    Состояние игры отдаётся тремя отдельными полями (`readiness`, `visibility`, `phase`)
    плюс `paused`: это независимые оси (`D-003`), а не одно значение.

    Ошибки отдаются в формате `ProblemDetail`; машинный код лежит в свойстве `code`,
    потому что текст переводится по ключу интернализации (`D-081`).

    Любое изменение файла требует обновления снапшота
    `src/test/resources/contract/openapi.snapshot.yaml`, иначе гейт краснеет.
servers:
  - url: /
paths:
  /games:
    post:
      summary: Создание игры мастером
      description: |
        Создатель становится мастером и участником со статусом `JOINED`. Игра рождается
        в состоянии `DRAFT`/`PRIVATE`/`NOT_STARTED` — это значения по умолчанию колонок в
        `001-baseline.yaml`. Оси независимы (`D-003`).
      operationId: createGame
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameRequest' }
      responses:
        '201':
          description: Игра создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: Игры, где пользователь мастер или участник
      operationId: listMyGames
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Список игр
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Игра по идентификатору
      operationId: getGame
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Игра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Правка названия, описаний и видимости
      description: После `FINISHED` правка описаний запрещена (`D-094`).
      operationId: updateGame
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGameRequest' }
      responses:
        '200':
          description: Игра после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Архивирование игры
      description: |
        Единственный способ снять игру с глаз: физического удаления нет (`D-010`).
        Причина обязательна. Повторный вызов идемпотентен и второго события не пишет.
        Архивированная игра остаётся читаемой участниками.
      operationId: archiveGame
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Игра в архиве
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Переходы, доступные из текущего состояния
      description: Клиент показывает кнопки по этому ответу, а не по своей копии правил.
      operationId: listGameTransitions
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Доступные переходы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Переход состояния игры
      description: |
        Отказ несёт машинный код и текст причины (`REQUIREMENTS §4`). Пауза требует причину;
        без неё переход отклоняется (`D-059`).
      operationId: applyGameTransition
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200':
          description: Игра после перехода
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Переход запрещён из текущего состояния
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/readiness:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Валидация готовности игры
      description: |
        Блокирующие замечания запрещают `DRAFT → READY`, предупреждающие не мешают:
        флаг готовности остаётся за мастером (`REQUIREMENTS §20`).
      operationId: getGameReadiness
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Отчёт валидации
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/turn:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Счётчик хода
      description: |
        Состояние пошагового режима (`REQUIREMENTS §14`): открыт ли ход, его номер и расход
        лимитов. «Ожидание мастера» — это `open: false`, а не вычисление по времени:
        таймаута в проекте нет (`D-060`). Расход виден мастеру целиком, игроку — только по
        его персонажам, наблюдателю — ничей (`D-063`).
      operationId: getTurn
      tags: [turn]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Счётчик хода
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/turn/open:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Открытие хода мастером
      description: |
        Мастер открывает ход всем сразу (`D-012`), поэтому открытый ход в игре один:
        повторное открытие при открытом ходе — `409 turn_already_open`. Требует включённого
        флага `turnBased` и незавершённой игры.
      operationId: openTurn
      tags: [turn]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Счётчик хода после открытия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ход уже открыт, режим выключен или игра завершена
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/turn/close:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Закрытие хода мастером
      description: |
        Закрытие сжигает несовершённое: следующий ход начинается с чистых лимитов (`D-012`).
        Смена хода — это закрытие и открытие, видимые в журнале двумя записями (`D-033`).
      operationId: closeTurn
      tags: [turn]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Счётчик хода после закрытия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Открытого хода нет или игра завершена
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/events:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Аудит-чтение журнала игры
      description: |
        Страница по возрастанию `seq` с курсором `after` и фильтром по типу. Курсор, а не
        `offset`: журнал растёт, и смещение пропускало бы и повторяло строки (`D-082`).
      operationId: listGameEvents
      tags: [game]
      security:
        - sessionCookie: []
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: type
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: События в порядке игрового номера
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/export.json:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Экспорт игры в JSON
      description: |
        Полный комплект игры для машины (`D-061`, `D-146`): все чаты, включая личные,
        персонажи с закрытыми историями, заметки и журнал. Доступен только мастеру
        (`D-021`): передача прав не предусмотрена, материал заменителю отдаётся вручную.
        Файл помечен разделом `closed` — получатель видит, что в нём закрыто.
      operationId: exportGameJson
      tags: [export]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Снимок игры
          headers:
            Content-Disposition:
              description: Имя файла `<название>-<id>.json`
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                description: Снимок; состав таблиц фиксирован версией формата
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/export.md:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Экспорт игры в Markdown
      description: |
        Тот же снимок, что и `export.json`, но для человека: транскрипты по чатам, мир,
        персонажи, предметы и заметки. Закрытые части помечены маркером «ЗАКРЫТО» и
        перечислены в шапке (`D-061`).
      operationId: exportGameMarkdown
      tags: [export]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Комплект в Markdown
          headers:
            Content-Disposition:
              description: Имя файла `<название>-<id>.md`
              schema: { type: string }
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/import:
    post:
      summary: Восстановление игры из снимка
      description: |
        Принимает файл `export.json` и восстанавливает игру в базу (`D-146`). Строки
        пишутся как данные, а не проигрыванием мутаций: журнал входит в снимок, и повтор
        операций дал бы другие идентификаторы и `seq`. Пользователи сопоставляются по
        логину; отсутствующие заводятся без почты и пароля. Если игра с таким
        идентификатором уже есть, нужен `asNewGame`.
      operationId: importGame
      tags: [export]
      security:
        - sessionCookie: []
      parameters:
        - name: asNewGame
          in: query
          required: false
          description: Восстановить рядом с оригиналом под новым идентификатором игры
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Снимок, полученный из `export.json`
      responses:
        '201':
          description: Игра восстановлена
          content:
            application/json:
              schema:
                type: object
                required: [gameId]
                properties:
                  gameId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/locations:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание локации мастером
      description: |
        Локация — узел графа (`REQUIREMENTS §7.1`). Удаление не предусмотрено ни до, ни после
        `READY` (`D-010`, `D-103`): только архивация с причиной.
      operationId: createLocation
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationRequest' }
      responses:
        '201':
          description: Локация создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Локации игры глазами запросившего
      description: |
        Архивная локация до `READY` игроку не отдаётся вовсе, после `READY` приходит с
        признаком и причиной (`D-009`).
      operationId: listLocations
      tags: [chat]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Локации
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GraphNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/locations/{chatId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    patch:
      summary: Правка названия и описания локации
      description: После `FINISHED` правка мира запрещена (`D-094`).
      operationId: updateLocation
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationRequest' }
      responses:
        '200':
          description: Локация после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление локации запрещено всегда
      description: |
        Физического удаления нет ни до, ни после `READY` (`D-010`, `D-103`). Ответ всегда
        `409` с машинным кодом и причиной; до `READY` текст причины подсказывает архивацию.
      operationId: deleteLocation
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Удаление не предусмотрено, используйте архивацию
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/locations/{chatId}/archive:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Архивирование локации с причиной
      description: 'Идемпотентно: повторный вызов не пишет второе событие.'
      operationId: archiveLocation
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Локация в архиве
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/locations/{chatId}/image:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    put:
      summary: Установка или снятие картинки локации
      description: |
        `assetId: null` снимает картинку: удаляется ссылка, а не ассет (`D-077`, `D-106`).
        Ассет обязан принадлежать этой же игре; прежняя картинка освобождается, если на неё
        больше никто не ссылается.
      operationId: setLocationImage
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationImageRequest' }
      responses:
        '200':
          description: Локация после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/graph:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Граф локаций глазами запросившего
      description: |
        Без `asCharacter` полный граф, включая архивные рёбра, видит только мастер. С
        `asCharacter` рёбра отбираются по знанию указанного персонажа; игрок обязан смотреть
        своим персонажем (`REQUIREMENTS §8`, `D-103`).
      operationId: getGameGraph
      tags: [chat]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Узлы и рёбра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameGraph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/graph/transitions:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание ориентированного перехода
      description: |
        Направление явное; симметричность задаётся двумя рёбрами (`REQUIREMENTS §8`).
        Переход архивируется с причиной, закрытие делается состоянием у персонажа.
      operationId: createTransition
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransitionRequest' }
      responses:
        '201':
          description: Переход создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Рёбра графа глазами запросившего
      operationId: listGraphTransitions
      tags: [chat]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Рёбра
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GraphEdge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/graph/transitions/{transitionId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TransitionId'
    patch:
      summary: Переименование перехода
      operationId: renameTransition
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameTransitionRequest' }
      responses:
        '200':
          description: Переход после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление перехода запрещено всегда
      operationId: deleteTransition
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Удаление не предусмотрено, используйте архивацию
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/graph/transitions/{transitionId}/archive:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TransitionId'
    post:
      summary: Архивирование перехода с причиной
      operationId: archiveTransition
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Переход в архиве
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/graph/transitions/{transitionId}/state:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TransitionId'
    put:
      summary: Состояние ребра для персонажа
      description: |
        Мастер ведёт знание ребра по каждому персонажу осознанно (`D-103`). Для
        `KNOWN_UNAVAILABLE` причина обязательна: именно её видит игрок. Идемпотентно.
      operationId: setTransitionState
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeStateRequest' }
      responses:
        '200':
          description: Состояние сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Заведение персонажа мастером
      description: |
        Карточка пишется целиком: частичная правка расходится со снимком, который уже
        читают клиенты. Создаёт только мастер (`D-020`), событие — `CHARACTER_CREATED`
        (`D-033`).
      operationId: createCharacter
      tags: [character]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterRequest' }
      responses:
        '201':
          description: Персонаж создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Персонажи игры
      description: |
        Скрытый персонаж у чужого игрока не появляется в ответе вовсе, а не приходит
        помеченным (`REQUIREMENTS §7.1`). Закрытая история заполнена только мастеру и
        играющему игроку (`REQUIREMENTS §9`). До `READY` архивный персонаж игроку не
        показывается, после — «выведен из игры» с причиной (`D-009`).
      operationId: listCharacters
      tags: [character]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Список персонажей глазами запросившего
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Character' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/characters/{characterId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Карточка персонажа
      description: Чужой персонаж отдаётся как отсутствующий, чтобы не выдать его существование.
      operationId: readCharacter
      tags: [character]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Карточка глазами запросившего
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Правка карточки персонажа
      description: Только мастер; событие `CHARACTER_CONTENT_CHANGED` (`D-033`).
      operationId: updateCharacter
      tags: [character]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterRequest' }
      responses:
        '200':
          description: Карточка обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление персонажа (всегда отказ)
      description: |
        Физического удаления нет ни до, ни после `READY` (`D-009`, `D-010`); ответ —
        `409` с кодом `character_not_deletable` и подсказкой про архивацию.
      operationId: deleteCharacter
      tags: [character]
      security:
        - sessionCookie: []
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters/{characterId}/archive:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    post:
      summary: Архивирование персонажа
      description: |
        Единственный способ убрать персонажа из игры (`D-009`). Активное присутствие
        закрывается, поэтому архивированный персонаж не остаётся в списках присутствующих
        живой игры. Идемпотентно. Событие — `CHARACTER_ARCHIVED`.
      operationId: archiveCharacter
      tags: [character]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Персонаж выведен из игры
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters/{characterId}/location:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    put:
      summary: Размещение и перемещение персонажа
      description: |
        `PUT`, а не `POST`: вызов задаёт итоговое положение, и повтор ничего не меняет.
        Мастер перемещает кого угодно куда угодно (`REQUIREMENTS §8`); право игрока идти
        своим персонажем по `AVAILABLE` переходу появляется вместе с занятостью (`E13`,
        `D-102`). События — `CHARACTER_LEFT` при уходе и `CHARACTER_ENTERED` при входе.
      operationId: placeCharacter
      tags: [character]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementRequest' }
      responses:
        '200':
          description: Положение установлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters/{characterId}/stealth:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    put:
      summary: Скрытность персонажа
      description: |
        Вход требует разрешения мастера, выход свободен (`D-006`); вторая половина —
        вместе с занятостью на `E13` (`D-102`). Уход публично видимого персонажа оставляет
        ещё событие `CHARACTER_APPEARED_LEFT`: для остальных он «отобразился как ушедший»
        (`D-007`). Идемпотентно.
      operationId: setCharacterStealth
      tags: [character]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StealthRequest' }
      responses:
        '200':
          description: Состояние скрытности сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters/{characterId}/occupation:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    put:
      summary: Занятие персонажа игроком
      description: |
        `PUT`, а не `POST`: вызов задаёт итоговое состояние слота, и повтор ничего не
        меняет. Захват идёт под блокировкой строки персонажа, поэтому двух победителей в
        гонке не бывает (`D-100`); чужой занятый слот отвергается кодом
        `character_occupied`. Ограничения «один персонаж на игрока» нет (`PLAN` E13,
        задача 2). Событие — `CHARACTER_OCCUPIED` (`D-128`).
      operationId: occupyCharacter
      tags: [character]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Слот занят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Освобождение персонажа
      description: |
        Слот становится свободным и может достаться другому, присутствие персонажа
        закрывается. Событие — `CHARACTER_RELEASED` (`D-128`).
      operationId: releaseCharacter
      tags: [character]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Слот свободен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters/{characterId}/move:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    post:
      summary: Перемещение своим персонажем по переходу
      description: |
        Игрок идёт только своим персонажем и только по переходу, который для него
        `AVAILABLE` (`REQUIREMENTS §8`, `D-107`). Направление берётся у ребра, а не у
        клиента: иначе игрок указал бы «откуда», и проверка «вы стоите именно там»
        обходилась бы. События — `CHARACTER_LEFT` и `CHARACTER_ENTERED`.
      operationId: moveCharacter
      tags: [character]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterMoveRequest' }
      responses:
        '200':
          description: Положение установлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/storages:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание хранилища
      description: |
        Только мастер (`D-109`). Тип решает владельца: у хранилища персонажа заполнен
        `characterId`, у локационного и сундука — `chatId` (`D-016`). Хранилище персонажа
        каждого типа одно, локационных и сундуков — сколько угодно (`REQUIREMENTS §10`).
        Появившееся хранилище закрыто: доступ меняется отдельным вызовом (`D-110`).
        Событие — `STORAGE_CREATED`.
      operationId: createStorage
      tags: [storage]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageRequest' }
      responses:
        '201':
          description: Хранилище создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/storages/{storageId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/StorageId'
    patch:
      summary: Правка названия и описания хранилища
      description: 'Только мастер; открытость через этот вызов не меняется. Событие — `STORAGE_CONTENT_CHANGED`.'
      operationId: updateStorage
      tags: [storage]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageRequest' }
      responses:
        '200':
          description: Хранилище обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/storages/{storageId}/image:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/StorageId'
    post:
      summary: Картинка хранилища
      description: |
        `assetId == null` — снятие (`D-106`). Прежняя картинка отпускается тем же вызовом,
        иначе замещённые файлы занимают диск навсегда (`D-077`). Событие — `STORAGE_CONTENT_CHANGED`.
      operationId: setStorageImage
      tags: [storage]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageRequest' }
      responses:
        '200':
          description: Ссылка на картинку сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/storages/{storageId}/access:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/StorageId'
    post:
      summary: Открытие и закрытие хранилища
      description: |
        Мастер открывает и закрывает доступ (`D-110`). Идемпотентно: повторная установка
        того же значения события не пишет, потому что мир не изменился. Событие —
        `STORAGE_ACCESS_CHANGED`.
      operationId: setStorageAccess
      tags: [storage]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageOpenRequest' }
      responses:
        '200':
          description: Доступ сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/locations/{chatId}/storages:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    get:
      summary: Хранилища локации
      description: |
        Локационное хранилище и сундуки глазами запросившего. Содержимое закрытого сундука
        не приходит ни строчкой, а хранилище отсутствующего персонажа не приходит вовсе
        (`REQUIREMENTS §10`, `D-019`).
      operationId: readLocationStorages
      tags: [storage]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Видимые хранилища локации
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Storage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/characters/{characterId}/storages:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Хранилища персонажа
      description: |
        Оба хранилища персонажа: скрытое видит только владелец, видимое — те, кому виден
        сам владелец, и только крупное содержимое (`D-019`, `D-017`).
      operationId: readCharacterStorages
      tags: [storage]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Видимые хранилища персонажа
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Storage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/items:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание предмета в хранилище
      description: |
        Только мастер (`D-109`). Предмета вне хранилища не бывает: строка размещения
        создаётся здесь же (`D-015`). Количество больше единицы разрешено только исчисляемым
        типам, по умолчанию — единица (`D-114`). Событие — `ITEM_CREATED`.
      operationId: createItem
      tags: [item]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemRequest' }
      responses:
        '201':
          description: Предмет создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      summary: Правка карточки предмета
      description: |
        Только мастер; размещение и количество через этот вызов не меняются — переезд
        предмета и разделение стопки идут отдельным вызовом (`D-114`). Событие —
        `ITEM_CONTENT_CHANGED`.
      operationId: updateItem
      tags: [item]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemRequest' }
      responses:
        '200':
          description: Предмет обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/items/{itemId}/image:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ItemId'
    post:
      summary: Картинка предмета
      description: '`assetId == null` — снятие; прежняя отпускается тем же вызовом (`D-077`).'
      operationId: setItemImage
      tags: [item]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageRequest' }
      responses:
        '200':
          description: Ссылка на картинку сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/items/{itemId}/move:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ItemId'
    post:
      summary: Перемещение предмета
      description: |
        Гонка разрешается блокировкой строки предмета: проигравший получает `409` с кодом
        `item_already_taken`, системного события проигравшему здесь нет (`D-015`, `D-113`).
        `fromStorageId` — ожидаемое текущее хранилище; `null` означает «откуда угодно»
        и доступен мастеру. Количество меньше текущего отделяет часть стопки новой строкой
        (`D-114`). Событие — `ITEM_MOVED`.
      operationId: moveItem
      tags: [item]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemMoveRequest' }
      responses:
        '200':
          description: Предмет перемещён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Запись сообщения в чат
      description: |
        Пять типов (`D-031`) и матрица прав `assertCanPost` (`D-065`). Права читаются из БД
        на каждое событие, поэтому снятие персонажа, мут и завершение игры действуют сразу,
        без переподключения сокета. Получатели материализуются при записи (`D-030`).
        Отзыва и правки сообщений нет как API (`D-008`).
      operationId: postMessage
      tags: [message]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostMessageRequest' }
      responses:
        '201':
          description: Сообщение записано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Лента чата
      description: |
        Единственный read-путь: строки берутся из `inbox_entry`, тело подклеивается по
        `message_id` (`D-030`), системные строки собираются из журнала (`D-031`).
        `afterSeq` — подтверждённый номер доставки, поэтому та же ручка служит resume (`D-083`).
        Чьими глазами смотреть, задаёт `asCharacter`; наблюдатель его не передаёт (`D-086`).
      operationId: readFeed
      tags: [message]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: afterSeq
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница ленты и метки курсора
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/chats/{chatId}/enter:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Вход в локацию
      description: |
        Курсор ставится на текущий `max(seq)`, и отдельно возвращается последняя реплика:
        видно только её (`D-032`), а не вся переписка с начала игры.
      operationId: enterChat
      tags: [message]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Курсор и последнее адресованное сообщение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/chats/{chatId}/read:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Отметка «прочитано до»
      description: |
        Пустое тело означает «до конца чата». Курсор двигается только вперёд и не может
        обогнать ленту, иначе клиент потерял бы строки при следующем чтении.
      operationId: markChatRead
      tags: [message]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '200':
          description: Курсор обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadCursor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/unread:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Счётчики непрочитанного
      description: |
        Считается по `inbox_entry`, поэтому бейдж сам по себе не учитывает скрытых
        персонажей и чужие личные каналы (`D-036`).
      operationId: readUnread
      tags: [message]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Итог и разбивка по чатам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unread' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/cursors:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Курсоры прочтения по чатам
      description: |
        Клиент держит эти метки между запросами и продолжает с них при resume (`D-083`).
      operationId: readCursors
      tags: [message]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Пары «идентификатор чата → последний прочитанный номер»
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/restrictions:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Навешивание ограничения
      description: |
        Ограничение отражает игровую ситуацию, поэтому причина обязательна, а срок — нет
        (`D-064`). Субъект диктуется видом: `NO_JOKE` — участие, остальные — персонаж
        (`D-099`). Бан — статус участия, а не ограничение (`REQUIREMENTS §13`).
      operationId: setRestriction
      tags: [restriction]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictionRequest' }
      responses:
        '201':
          description: Ограничение навешено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restriction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Список ограничений
      description: |
        Мастер видит все ограничения игры, участник — только те, что касаются его персонажей
        и его участия: иначе список раскрыл бы, кого мастер ограничил и почему.
      operationId: readRestrictions
      tags: [restriction]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ограничения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Restriction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/restrictions/{restrictionId}/revoke:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/RestrictionId'
    post:
      summary: Снятие ограничения
      description: |
        Снятие — штатная операция мастера: строка остаётся частью истории, меняется только
        `revokedAt` (`D-010`, `D-064`). Удаления ограничения нет как API.
      operationId: revokeRestriction
      tags: [restriction]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ограничение снято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restriction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/channels:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Закрытые каналы игры глазами смотрящего
      description: |
        Радиочаты, шёпоты, личные чаты с мастером и чат финального обсуждения (`E11`).
        Локации здесь не перечисляются: они живут в графе (`E04`). Наблюдателю каналы не
        показываются (`D-063`); мастеру — все, кроме чужих личных чатов, где он не участник
        (`D-037`). Счётчик непрочитанного считается по `inbox_entry` (`D-036`).
      operationId: listChannels
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Список каналов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/channels/{chatId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    get:
      summary: Канал и состав его участников
      description: |
        Участники идут с состоянием: `INVITED` — приглашение, на которое ещё нужно ответить
        (`D-038`); `JOINED` — внутри. Невидимый канал отдаётся как `403 not_a_chat_member`,
        а не `404`: чужой канал существует, но не этому смотрящему.
      operationId: readChannel
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Канал глазами смотрящего
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/radios:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание радиочата мастером
      description: |
        Радио связывает фиксированный список персонажей и не требует общей локации
        (`D-039`). Говорить в нём можно только речью: `ACTION` и `JOKE` отклоняются с
        `radio_speech_only`. Событие — `CHAT_CREATED`.
      operationId: createRadio
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RadioRequest' }
      responses:
        '201':
          description: Радиочат создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/whispers:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание шёпота
      description: |
        Многосторонний приватный разговор (`D-038`, `D-097`). Условия проверяются в момент
        приглашения и отклоняются разными кодами: одна локация (`whisper_same_location`),
        одинаковая скрытность (`whisper_same_stealth`), разрешение говорить
        (`whisper_speech_restricted`). Нужны минимум два персонажа разных игроков
        (`whisper_players`). Инициатор входит сразу, остальные получают `INVITED`; мастер
        состоит по умолчанию. События — `CHAT_CREATED` и `CHAT_MEMBER_INVITED`.
      operationId: createWhisper
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhisperRequest' }
      responses:
        '201':
          description: Шёпот создан, часть участников приглашена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/channels/{chatId}/members:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    put:
      summary: Замена состава радиочата
      description: |
        `PUT` задаёт итоговый круг, поэтому повтор с тем же телом ничего не меняет. Убранные
        получают `CHAT_MEMBER_LEFT`, добавленные — `CHAT_MEMBER_JOINED` (`D-010`).
      operationId: setRadioMembers
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RadioMembersRequest' }
      responses:
        '200':
          description: Состав обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/channels/{chatId}/disabled:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    put:
      summary: Отключение и включение радиочата
      description: |
        Отключённый радиочат не принимает сообщения (`409 chat_disabled`), но остаётся
        читаемым: история связи — часть игры (`D-039`). Событие — `CHAT_ACCESS_CHANGED`.
      operationId: setRadioDisabled
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RadioDisabledRequest' }
      responses:
        '200':
          description: Состояние радиочата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/channels/{chatId}/accept:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Согласие на участие в шёпоте
      description: Приглашение становится участием; событие — `CHAT_MEMBER_JOINED` (`D-038`).
      operationId: acceptWhisper
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Участие подтверждено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/channels/{chatId}/decline:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Отказ от приглашения в шёпот
      description: 'Состояние `DECLINED` вместо тишины: приглашающий обязан видеть ответ. Событие — `CHAT_MEMBER_DECLINED`.'
      operationId: declineWhisper
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Приглашение отклонено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/channels/{chatId}/close:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Закрытие шёпота
      description: |
        Закрыть может участник или мастер (`D-038`). Участия закрываются, чат архивируется:
        история остаётся читаемой (`D-010`). Событие — `CHAT_ARCHIVED`.
      operationId: closeWhisper
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Шёпот закрыт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Заметки тетради
      description: |
        Заметки — мета-слой персонажа (`§15.1`). Мастер видит заметки всех игроков (`D-054`),
        игрок — только свои и за своих персонажей, наблюдателю заметок нет вовсе (`D-063`).
        Подсветка сообщений считается при записи (`D-050`) и лежит в `matchedNoteIds` строки.
      operationId: listNotes
      tags: [note]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Заметки, видимые смотрящему
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Создание заметки
      description: |
        До десяти ключей на заметку, тело до 2000 знаков (`D-098`). Ключ сравнивается по
        лемме и границе слова, имя — точно (`D-051`); нормализация по `D-080`. Составление
        вызывает асинхронный досчёт подсветки (`D-087`): заметка сразу отдаётся с
        `matchingPending`, а подсветка появляется после пересчёта.
      operationId: createNote
      tags: [note]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteRequest' }
      responses:
        '201':
          description: Заметка создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - name: noteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Правка заметки
      description: |
        Правит только автор: мастер видит заметки игроков (`D-054`), но переписать чужое
        замечание не вправе. Цель правкой не меняется. Ключи задаются целиком, старые
        помечаются `superseded` (`D-010`), и запускается досчёт подсветки (`D-087`).
      operationId: updateNote
      tags: [note]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteRequest' }
      responses:
        '200':
          description: Заметка обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/saved-messages:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Сохранённые сообщения тетради
      description: |
        Записи принадлежат участию (`D-055`), поэтому смена персонажа их не теряет, а
        наблюдатель пользуется тетрадью наравне с игроком (`D-063`). Видны только свои.
      operationId: listSavedMessages
      tags: [note]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Сохранённые сообщения смотрящего
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Сохранение сообщения в тетрадь
      description: |
        Снимок текста и имени говорящего берётся в момент сохранения (`D-055`). Сохранить
        можно только то, что субъекту выдали в ленте (`D-030`). Повтор того же сообщения
        уточняет комментарий, а не создаёт вторую запись.
      operationId: saveMessage
      tags: [note]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMessageRequest' }
      responses:
        '201':
          description: Сообщение сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/saved-messages/{savedId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - name: savedId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Правка комментария сохранённого сообщения
      description: |
        Меняется только комментарий: снимок текста и имени неподвижен (`D-055`).
        Правит только владелец записи.
      operationId: commentSavedMessage
      tags: [note]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200':
          description: Комментарий обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/memberships:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Состав игры
      description: |
        Мастеру — весь состав, участнику — только своё участие (`REQUIREMENTS §6`).
        Мастер не выходит из игры и не банится (`D-133`).
      operationId: listMemberships
      tags: [membership]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Состав глазами запросившего
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/memberships/invitations:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Приглашение в игру
      description: |
        Только мастер; адрес — логин существующего аккаунта, поэтому неизвестный логин
        отвергается кодом `unknown_login` до всякой записи (`D-131`). Приглашение
        бронирует слот (`reservedCharacterId`), но не занимает его (`D-130`);
        `characterId` необязателен, и брони без него не возникает. Роль по умолчанию
        `PLAYER`; `OBSERVER` открывает приватную игру для чтения и слот не бронирует.
        Приглашение в `RUNNING` разрешено и отличается досчётом видимости (`D-086`).
        Повтор с тем же слотом идемпотентен.
      operationId: inviteToGame
      tags: [membership]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRequest' }
      responses:
        '200':
          description: Участие приглашено или приглашение обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/memberships/invitation/accept:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Согласие с приглашением
      description: |
        Слот занимается здесь и только здесь (`D-130`); приглашение наблюдателя брони не
        имеет, и согласие такого участия — только смена статуса. Событие —
        `MEMBERSHIP_JOINED`.
      operationId: acceptInvitation
      tags: [membership]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Участие вошло в игру
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/memberships/invitation/decline:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Отказ от приглашения
      description: |
        `DECLINED`, а не выход: приглашённый в игру не входил (`D-123`). Бронь слота
        снимается, и персонаж снова свободен. Событие — `MEMBERSHIP_DECLINED` (`D-128`).
      operationId: declineInvitation
      tags: [membership]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Приглашение отклонено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/memberships/join:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Свободный вход в публичную игру
      description: |
        Открыт после `READY` и только в публичной игре: приватная отвечает `private_game`,
        неготовая — `game_not_ready` (`D-132`). Роль выбирается по наличию свободного
        играбельного персонажа без брони: свободного слота нет — вход наблюдателем.
        Повтор идемпотентен; вошедшему игроку сразу открывается личный чат с мастером
        (`D-037`).
      operationId: joinOpenGame
      tags: [membership]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Участие вошло в игру
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/memberships/leave:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Добровольный выход из игры
      description: |
        Занятые слоты освобождаются, история персонажей, сообщений и заметок остаётся:
        физического удаления нет (`D-009`). Мастер выйти не может (`D-133`).
      operationId: leaveGame
      tags: [membership]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Участие вышло из игры
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/memberships/ban:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Бан участника в одной игре
      description: |
        `BANNED` — статус участия, а не глобальный запрет: другие игры человека это не
        трогает (`D-133`). Бан освобождает слоты участия. Событие — `MEMBERSHIP_BANNED`.
      operationId: banMember
      tags: [membership]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberLoginRequest' }
      responses:
        '200':
          description: Участие забанено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Очередь заявок
      description: |
        Мастеру — вся очередь, участнику — только свои заявки (`REQUIREMENTS §17`).
        Фильтр `status` необязателен.
      operationId: listRequests
      tags: [request]
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, RUNNING, SUCCEEDED, FAILED, APPROVED, REJECTED, PARTIALLY_APPROVED, EXPIRED]
      responses:
        '200':
          description: Заявки глазами запросившего
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Подача заявки
      description: |
        Одно горло для трёх источников (`D-040`): `origin` различает игрока, мастера и
        предложение модели, а машина применения общая. Заявка мир не меняет — изменение
        начинается с решения мастера. Невалидный change set сохраняется статусом `FAILED`
        с причиной, а не отвергается целиком (`D-043`). Повтор с тем же `idempotencyKey`
        возвращает прежнюю заявку (`PLAN` E14, задача 6).
      operationId: submitRequest
      tags: [request]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequestRequest' }
      responses:
        '200':
          description: Заявка принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Одна заявка с операциями
      description: |
        Мастеру видна любая заявка игры, участнику — только своя. Операции отдаются
        вместе с заявкой, потому что без них нечего одобрять (`D-041`).
      operationId: getRequest
      tags: [request]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Заявка с операциями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Решение мастера по заявке
      description: |
        `approve` — номера операций к применению; остальные отклоняются. Пустой список
        означает отказ от всех операций. Каждая операция применяется своей транзакцией
        (`D-137`), итог — `APPROVED`, `PARTIALLY_APPROVED`, `REJECTED` или `FAILED`
        по факту применения, а не по замыслу (`D-135`).
      operationId: decideRequest
      tags: [request]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/requests/{requestId}/rollback:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Откат применённых операций заявки
      description: |
        Обратимые операции возвращают прежнее значение, взятое из журнала (`D-138`).
        Необратимые (`create_item`, `post_master_message`, `create_note`) откатить нельзя:
        удаление запрещено (`D-010`), отзыв сообщений запрещён (`D-008`). Откат идёт в
        обратном порядке применения. Пустое тело означает «все примененные».
      operationId: rollbackRequest
      tags: [request]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Откат выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/llm:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Доступность опций модели
      description: |
        Без активного ключа мастера опции LLM недоступны целиком (`D-042`, `D-093`):
        клиент скрывает панель модели, а не показывает кнопку, которая падает. Спрашивать
        может только мастер.
      operationId: llmStatus
      tags: [llm]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Доступность и причина отказа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/llm/proposals:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Предложение модели
      description: |
        Вызов со-мастера или автопилота (`REQUIREMENTS §18`). Заявка заводится до вызова
        со статусом `RUNNING` (`D-043`), поэтому перезапуск сервера не теряет запрос; ответ
        становится change set и переводит её в `SUCCEEDED`, отказ провайдера — в `FAILED`
        с машинным кодом причины (`llm_rate_limited`, `llm_timeout`,
        `llm_invalid_response`, `llm_provider_error`, `llm_auth_failed`). Вызов идёт вне
        транзакции (`D-044`), один одновременный запрос на игру.
      operationId: llmPropose
      tags: [llm]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LlmProposalRequest' }
      responses:
        '200':
          description: Заявка модели в любом исходе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /games/{id}/memberships/unban:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Снятие бана
      description: |
        Возвращает право входа, но не вводит человека в игру за него: участие переходит в
        `LEFT` (`D-133`). Событие — `MEMBERSHIP_UNBANNED` (`D-128`).
      operationId: unbanMember
      tags: [membership]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberLoginRequest' }
      responses:
        '200':
          description: Бан снят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/assets:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Загрузка медиа-ассета мастером
      description: |
        Формат определяется по содержимому, не по расширению (`D-074`): whitelist
        `jpeg, png, webp, gif`, отдельные отказы на SVG и HTML. Сторона проверяется по
        заголовку до декодирования (`D-076`), метаданные вырезаются при записи (`D-077`).
        Загрузка ассета ещё не мутирует мир: событие в журнале появляется при привязке.
      operationId: uploadAsset
      tags: [media]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Ассет принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /games/{id}/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/AssetId'
    get:
      summary: Отдача медиа-ассета
      description: |
        Отдаётся приложением, а не веб-сервером: проверка участия стоит на каждом запросе
        (`D-075`). Посторонний получает `404`, а не `403`, — иначе код ответа выдал бы
        существование чужой игры. Отдача идёт с `nosniff`, точным `Content-Type` и долгим
        `Cache-Control` с идентификатором в URL (`D-077`).
      operationId: readAsset
      tags: [media]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Содержимое ассета
          headers:
            Cache-Control:
              description: Долгий кэш; идентификатор ассета неперечислим и неизменяем
              schema: { type: string }
            X-Content-Type-Options:
              description: Всегда `nosniff`
              schema: { type: string }
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/gif: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Ассета нет, он из другой игры или нет участия
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /ops/metrics:
    get:
      summary: Числа эксплуатации узла
      description: |
        Служебный контур (`PLAN` O02, `D-147`): живые сокеты по играм, загрузка пула
        LLM и размер журнала. Аутентификация — заголовок `X-Ops-Token` из окружения,
        а не сессия игрока: мониторинг обращается без cookie, а мастер игры не должен
        видеть числа всего узла. Пустой токен выключает маршрут (404).
      operationId: opsMetrics
      tags: [ops]
      parameters:
        - $ref: '#/components/parameters/OpsToken'
      responses:
        '200':
          description: Числа узла
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ops/orphans/dry-run:
    post:
      summary: Сухой прогон орфан-сборки
      description: |
        Перечисляет ассеты, которые удалила бы плановая сборка (`D-077`), и ничего не
        удаляет. Нужен потому, что плановый прогон пишет только в лог: «сколько мусора»
        спрашивают до удаления, а не после.
      operationId: opsOrphanDryRun
      tags: [ops]
      parameters:
        - $ref: '#/components/parameters/OpsToken'
      responses:
        '200':
          description: Кандидаты на удаление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrphanReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/register:
    post:
      summary: Открытая регистрация по логину и паролю
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Аккаунт создан, сессия выдана cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      summary: Вход по логину и паролю
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вход выполнен, сессия выдана cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/verify-email:
    post:
      summary: Подтверждение адреса почты по ссылке из письма
      description: |
        Без аутентификации: ссылку открывают из почтового клиента (`D-141`). Ответ
        одинаков для истёкшей, использованной и чужой ссылки (`D-079`).
      operationId: verifyEmail
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204':
          description: Адрес подтверждён
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/logout:
    post:
      summary: Выход на текущем устройстве
      operationId: logout
      tags: [auth]
      responses:
        '204':
          description: Сессия отозвана, cookie снята
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
  /auth/logout-all:
    post:
      summary: Выход на всех устройствах
      operationId: logoutAll
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Все сессии пользователя отозваны
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      summary: Текущий пользователь
      operationId: getMe
      tags: [profile]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Обновление отображаемого имени, почты и темы
      operationId: updateMe
      tags: [profile]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Профиль после обновления
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление аккаунта с анонимизацией PII
      operationId: deleteMe
      tags: [profile]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Вход заблокирован, PII анонимизированы, сессии удалены
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/email/verification:
    post:
      summary: Повторное письмо подтверждения адреса
      description: |
        Лимит по человеку и клиенту, как у сброса пароля (`D-079`, `D-141`).
      operationId: resendEmailVerification
      tags: [profile]
      security:
        - sessionCookie: []
      responses:
        '202':
          description: Письмо отправлено
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/password:
    post:
      summary: Смена пароля
      description: Инвалидирует все сессии, включая текущую (`D-096`).
      operationId: changePassword
      tags: [profile]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Пароль изменён, сессии отозваны
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/password/reset:
    post:
      summary: Запрос письма для сброса пароля
      description: |
        Ответ одинаков для существующего и несуществующего адреса (`D-079`).
      operationId: requestPasswordReset
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Письмо отправлено, если адрес существует
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/password/reset/confirm:
    post:
      summary: Установка нового пароля по токену из письма
      operationId: confirmPasswordReset
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordConfirmRequest' }
      responses:
        '204':
          description: Пароль установлен, все сессии отозваны
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/llm-credentials:
    get:
      summary: Ключи LLM пользователя
      description: Секрет не возвращается ни в каком виде (`D-093`).
      operationId: listLlmCredentials
      tags: [llm]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ключи без секретов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LlmCredentialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Добавление ключа LLM
      operationId: createLlmCredential
      tags: [llm]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialRequest' }
      responses:
        '201':
          description: Ключ сохранён зашифрованным, активным не становится
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmCredentialView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/llm-credentials/{id}/activate:
    post:
      summary: Сделать ключ активным
      description: Активный ключ у пользователя ровно один.
      operationId: activateLlmCredential
      tags: [llm]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Ключ активен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmCredentialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/llm-credentials/{id}:
    delete:
      summary: Удаление ключа LLM
      operationId: deleteLlmCredential
      tags: [llm]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '204':
          description: Ключ удалён
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CHATTERGAME_SESSION
  parameters:
    OpsToken:
      name: X-Ops-Token
      in: header
      required: true
      description: Служебный токен из `CHATTERGAME_OPS_TOKEN` (`D-147`)
      schema: { type: string }
    CredentialId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StorageId:
      name: storageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransitionId:
      name: transitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RestrictionId:
      name: restrictionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    SessionCookie:
      description: HttpOnly, SameSite=Lax, срок 30 дней
      schema: { type: string }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Требуется вход или неверные креденшалы
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Нет доступа к игре или нет права на действие
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Логин или почта уже заняты
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Превышен лимит частоты запросов
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: Ошибка в формате ProblemDetail с машинным кодом в поле `code`.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    UserProfile:
      type: object
      required: [id, login, displayName, theme, emailVerified]
      properties:
        id: { type: string, format: uuid }
        login: { type: string, description: Отображаемая форма, регистр сохранён }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        avatarAssetId: { type: [string, 'null'], format: uuid }
        theme: { type: string, enum: [system, light, dark] }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, maxLength: 64, description: NFC-нормализация на сервере }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: [string, 'null'], maxLength: 128 }
        email: { type: [string, 'null'], maxLength: 320 }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: [string, 'null'], maxLength: 128 }
        email: { type: [string, 'null'], maxLength: 320 }
        theme: { type: [string, 'null'], enum: [system, light, dark, 'null'] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 320 }
    ResetPasswordConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
    LlmCredentialView:
      type: object
      description: Секрет отсутствует в схеме целиком (`D-093`).
      required: [id, baseUrl, model, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, 'null'], maxLength: 64 }
        baseUrl: { type: string }
        model: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateCredentialRequest:
      type: object
      required: [baseUrl, model, secret]
      properties:
        label: { type: [string, 'null'], maxLength: 64 }
        baseUrl: { type: string, maxLength: 255 }
        model: { type: string, maxLength: 128 }
        secret: { type: string, description: Пишется только сюда, обратно не возвращается }
    Game:
      type: object
      description: |
        Состояние игры — три независимые оси (`D-003`) плюс флаг паузы (`D-059`).
        `readOnly` вычисляется сервером: после `FINISHED` мир доступен только на чтение (`D-094`).
      required: [id, masterUserId, title, readiness, visibility, phase, paused, turnBased, archived, readOnly]
      properties:
        id: { type: string, format: uuid }
        masterUserId: { type: string, format: uuid, description: Мастерство не передаётся (`D-021`) }
        title: { type: string, maxLength: 200 }
        publicDescription: { type: [string, 'null'] }
        privateDescription: { type: [string, 'null'], description: Видно мастеру и участникам с правом чтения }
        readiness: { type: string, enum: [DRAFT, READY] }
        visibility: { type: string, enum: [PRIVATE, PUBLIC] }
        phase: { type: string, enum: [NOT_STARTED, RUNNING, FINISHED] }
        paused: { type: boolean }
        pauseReason: { type: [string, 'null'] }
        turnBased: { type: boolean }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        readOnly: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Turn:
      type: object
      description: |
        Счётчик хода (`REQUIREMENTS §14`). `n` — номер последнего хода, `0` если ход не
        открывали. `open` — открыт ли он сейчас; отдельного признака «ожидание мастера»
        нет, потому что по времени ничего не вычисляется (`D-060`). `budgets` сужены под
        смотрящего: мастер видит всех, игрок — своих персонажей, наблюдатель — никого.
      required: [turnBased, open, n, budgets]
      properties:
        turnBased: { type: boolean, description: Флаг пошагового режима (`D-012`) }
        open: { type: boolean }
        n: { type: integer, format: int64, minimum: 0 }
        openedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        budgets:
          type: array
          items:
            type: object
            required: [characterId, actionUsed, speechUsed]
            properties:
              characterId: { type: string, format: uuid }
              actionUsed: { type: boolean }
              speechUsed: { type: boolean }
    CreateGameRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        publicDescription: { type: [string, 'null'] }
        privateDescription: { type: [string, 'null'] }
    UpdateGameRequest:
      type: object
      description: Отсутствующее поле означает «не трогать»; `PATCH`, а не `PUT`.
      properties:
        title: { type: [string, 'null'], maxLength: 200 }
        publicDescription: { type: [string, 'null'] }
        privateDescription: { type: [string, 'null'] }
        visibility: { type: [string, 'null'], enum: [PRIVATE, PUBLIC, 'null'] }
        turnBased: { type: [boolean, 'null'], description: Пошаговый режим (`D-012`) }
    ArchiveRequest:
      type: object
      description: Причина архивации. Обязательна: архив без причины не объясняет участникам, почему игра встала (`D-010`).
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    OpsMetrics:
      type: object
      description: |
        Числа эксплуатации (`PLAN` O02). `sockets` — живые соединения этого узла,
        `llm` — загрузка пула вызовов модели, `journal` — размер журнала и его
        материализации. Доменные данные здесь не отдаются.
      required: [sockets, llm, journal]
      properties:
        sockets:
          type: object
          required: [total, byGame]
          properties:
            total: { type: integer }
            byGame:
              type: object
              additionalProperties: { type: integer }
        llm:
          type: object
          required: [active, queued, capacity]
          properties:
            active: { type: integer, description: Сколько игр ждёт ответа модели прямо сейчас }
            queued: { type: integer, description: Глубина очереди вызовов }
            capacity: { type: integer }
        journal:
          type: object
          required: [events, byGame, bytes]
          properties:
            events: { type: integer, format: int64 }
            byGame:
              type: object
              additionalProperties: { type: integer, format: int64 }
            bytes:
              type: object
              additionalProperties: { type: integer, format: int64 }
    OrphanReport:
      type: object
      description: Результат сухого прогона орфан-сборки (`D-077`).
      required: [deleted, candidates, bytes, dryRun]
      properties:
        deleted:
          type: array
          items: { type: string, format: uuid }
        candidates:
          type: array
          items: { type: string, format: uuid }
        bytes: { type: integer, format: int64 }
        dryRun: { type: boolean }
    TransitionRequest:
      type: object
      required: [transition]
      properties:
        transition: { type: string, enum: [MARK_READY, RETURN_TO_DRAFT, START, PAUSE, RESUME, FINISH] }
        pauseReason: { type: [string, 'null'], description: Обязателен для `PAUSE` (`D-059`) }
    TransitionList:
      type: object
      required: [transitions]
      properties:
        transitions:
          type: array
          items:
            type: object
            required: [transition, reason]
            properties:
              transition: { type: string }
              reason: { type: string, description: Текст для мастера, не контракт (`D-081`) }
    ReadinessReport:
      type: object
      description: Блокирующие замечания запрещают `DRAFT → READY`, предупреждающие — нет (`REQUIREMENTS §20`).
      required: [blocking, warning]
      properties:
        blocking:
          type: array
          items: { $ref: '#/components/schemas/ReadinessFinding' }
        warning:
          type: array
          items: { $ref: '#/components/schemas/ReadinessFinding' }
    ReadinessFinding:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    GameEvent:
      type: object
      description: |
        Запись журнала. `seq` непрерывен в пределах игры и выдаётся под блокировкой счётчика
        (`D-033`); состав типов зафиксирован в `contract/events.schema.json`.
      required: [id, seq, type, onBehalfOfMaster, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        type: { type: string }
        chatId: { type: [string, 'null'], format: uuid }
        actorUserId: { type: [string, 'null'], format: uuid }
        characterId: { type: [string, 'null'], format: uuid }
        onBehalfOfMaster: { type: boolean }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
    LocationRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
    Location:
      type: object
      description: |
        Локация (`REQUIREMENTS §7.1`). `archived` и `archivedReason` — отдельные поля:
        клиент показывает «выведено из игры» с причиной (`D-009`).
      required: [id, gameId, kind, title, archived, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        kind: { type: string, enum: [LOCATION] }
        title: { type: string }
        description: { type: [string, 'null'] }
        imageAssetId: { type: [string, 'null'], format: uuid, description: Картинка локации, одна на сущность (`D-098`) }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    LocationImageRequest:
      type: object
      description: Пустая ссылка снимает картинку; удаления ассета здесь нет (`D-077`).
      properties:
        assetId: { type: [string, 'null'], format: uuid }
    Asset:
      type: object
      description: |
        Метаданные ассета (`REQUIREMENTS §19`). Ключа хранилища в контракте нет: клиент
        ходит по `/assets/{id}`, и переезд на объектное хранилище контракт не меняет.
      required: [id, gameId, mime, byteSize, width, height, sha256, createdAt]
      properties:
        id: { type: string, format: uuid, description: Неперечислимый идентификатор (`D-075`) }
        gameId: { type: string, format: uuid }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
        byteSize: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sha256: { type: string, description: Хеш содержимого после вырезания метаданных (`D-077`) }
        originalName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ArchiveRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    CreateTransitionRequest:
      type: object
      required: [fromChatId, toChatId]
      properties:
        fromChatId: { type: string, format: uuid }
        toChatId: { type: string, format: uuid }
        title: { type: [string, 'null'], maxLength: 200 }
    RenameTransitionRequest:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 200 }
    Transition:
      type: object
      required: [id, gameId, fromChatId, toChatId, archived, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        fromChatId: { type: string, format: uuid }
        toChatId: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    EdgeStateRequest:
      type: object
      required: [characterId, state]
      properties:
        characterId: { type: string, format: uuid }
        state: { type: string, enum: [UNKNOWN, KNOWN_UNAVAILABLE, AVAILABLE] }
        reason: { type: [string, 'null'], maxLength: 500 }
    EdgeState:
      type: object
      required: [transitionId, characterId, state]
      properties:
        transitionId: { type: string, format: uuid }
        characterId: { type: string, format: uuid }
        state: { type: string, enum: [UNKNOWN, KNOWN_UNAVAILABLE, AVAILABLE] }
        reason: { type: string }
    CharacterRequest:
      type: object
      description: |
        Карточка целиком (`REQUIREMENTS §9`). Поля видимости неодинаковы, но пишет их
        мастер одним запросом: частичная правка расходится со снимком у читателей.
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        portraitAssetId: { type: [string, 'null'], format: uuid }
        appearance: { type: [string, 'null'] }
        publicHistory: { type: [string, 'null'] }
        privateHistory: { type: [string, 'null'] }
        playable: { type: boolean }
        npc: { type: boolean }
    StorageKind:
      type: string
      description: 'Тип хранилища (`D-016`). Хранилища персонажа по одному на тип, локационных больше.'
      enum: [CHARACTER_HIDDEN, CHARACTER_VISIBLE, LOCATION, CHEST]
    ItemType:
      type: string
      description: |
        Закрытый перечень типов предмета (`D-114`). Списка в БД нет намеренно: он стал бы
        второй правдой рядом с перечислением.
      enum: [WEAPON, ARMOR, CLOTHING, TOOL, DOCUMENT, KEY, VALUABLE, CONSUMABLE, MONEY, QUEST, MISC]
    ItemSize:
      type: string
      description: 'Размер решает, в какое из двух хранилищ персонажа предмет помещается (`D-111`).'
      enum: [SMALL, LARGE]
    StorageRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/StorageKind' }
        chatId: { type: [string, 'null'], format: uuid, description: 'Локация; обязательна для локационного хранилища и сундука' }
        characterId: { type: [string, 'null'], format: uuid, description: 'Владелец; обязателен для хранилищ персонажа' }
        title: { type: [string, 'null'], maxLength: 200 }
        description: { type: [string, 'null'] }
    StorageOpenRequest:
      type: object
      required: [open]
      properties:
        open: { type: boolean }
    ImageRequest:
      type: object
      properties:
        assetId: { type: [string, 'null'], format: uuid, description: '`null` — снятие картинки' }
    Storage:
      type: object
      description: |
        Хранилище глазами запросившего. `contentsVisible` отдельно от `items`: закрытый
        сундук виден, а содержимое — нет (`REQUIREMENTS §10`).
      required: [id, kind, open, contentsVisible]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/StorageKind' }
        chatId: { type: [string, 'null'], format: uuid }
        characterId: { type: [string, 'null'], format: uuid }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        imageAssetId: { type: [string, 'null'], format: uuid }
        open: { type: boolean }
        contentsVisible: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    ItemRequest:
      type: object
      required: [name, size]
      properties:
        type: { $ref: '#/components/schemas/ItemType' }
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'] }
        imageAssetId: { type: [string, 'null'], format: uuid }
        size: { $ref: '#/components/schemas/ItemSize' }
        quantity: { type: [integer, 'null'], description: 'Больше единицы — только у исчисляемых типов (`D-114`)' }
        properties: { type: [string, 'null'] }
        storageId: { type: [string, 'null'], format: uuid, description: 'Обязателен при создании; при правке не используется' }
    ItemMoveRequest:
      type: object
      required: [storageId]
      properties:
        fromStorageId: { type: [string, 'null'], format: uuid, description: 'Ожидаемое текущее хранилище; `null` — откуда угодно' }
        storageId: { type: string, format: uuid }
        quantity: { type: [integer, 'null'], description: 'Меньше текущего — отделяется новая строка (`D-114`)' }
    Item:
      type: object
      required: [id, type, name, size, quantity]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ItemType' }
        name: { type: string }
        description: { type: [string, 'null'] }
        imageAssetId: { type: [string, 'null'], format: uuid }
        size: { $ref: '#/components/schemas/ItemSize' }
        quantity: { type: integer }
        properties: { type: [string, 'null'] }
    Character:
      type: object
      description: |
        Карточка глазами запросившего. `privateHistory` заполнен только мастеру и
        играющему игроку, `hidden` — только мастеру; игроку скрытый персонаж не приходит
        вовсе (`D-030`).
      required: [id, gameId, name]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        name: { type: string }
        portraitAssetId: { type: [string, 'null'], format: uuid }
        appearance: { type: [string, 'null'] }
        publicHistory: { type: [string, 'null'] }
        privateHistory: { type: [string, 'null'] }
        playable: { type: boolean }
        npc: { type: boolean }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        hidden: { type: boolean }
        mine: { type: boolean }
    PlacementRequest:
      type: object
      required: [chatId]
      properties:
        chatId: { type: string, format: uuid }
    StealthRequest:
      type: object
      required: [hidden]
      properties:
        hidden: { type: boolean }
        reason: { type: [string, 'null'] }
    Placement:
      type: object
      required: [characterId, chatId, hidden]
      properties:
        characterId: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        hidden: { type: boolean }
    PresentCharacter:
      type: object
      description: |
        Персонаж в списке присутствующих. `hidden` заполнен только для мастера: игроку
        скрытый персонаж не приходит вовсе (`REQUIREMENTS §7.1`).
      required: [id, name, hidden]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        portraitAssetId: { type: [string, 'null'], format: uuid }
        hidden: { type: boolean }
    GraphNode:
      type: object
      description: |
        Локация глазами смотрящего. `present` — присутствующие персонажи (`E06`), приходят
        вместе с узлом, а не отдельным запросом: второй read-путь к тем же строкам
        разошёлся бы с первым (`D-030`).
      required: [id, title, archived, present]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        present:
          type: array
          items: { $ref: '#/components/schemas/PresentCharacter' }
    GraphEdge:
      type: object
      description: |
        Ребро глазами смотрящего. `state` — знание конкретного персонажа
        (`REQUIREMENTS §8`); у мастера без `asCharacter` он `null`. Рёбра в состоянии
        `UNKNOWN` в ответ не попадают.
      required: [id, fromChatId, toChatId]
      properties:
        id: { type: string, format: uuid }
        fromChatId: { type: string, format: uuid }
        toChatId: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        state: { type: [string, 'null'], enum: [UNKNOWN, KNOWN_UNAVAILABLE, AVAILABLE, 'null'] }
        reason: { type: [string, 'null'] }
    GameGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
    MessageKind:
      type: string
      enum: [SPEECH, ACTION, JOKE, MASTER, SYSTEM]
    PostMessageRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/MessageKind' }
        characterId:
          type: [string, 'null']
          format: uuid
          description: Обязателен для `SPEECH` и `ACTION`; у шутки и события мира автора может не быть
        body: { type: [string, 'null'], maxLength: 4000, description: 'Лимит длины (`D-098`)' }
        onBehalfOfMaster:
          type: boolean
          default: false
          description: 'Сообщение мастера от лица персонажа; расходует бюджет персонажа (`D-005`)'
    Message:
      type: object
      description: |
        Строка ленты: либо сообщение, либо системная проекция журнала (`D-031`). У системной
        строки пусты `messageId` и `body`, но заполнен `systemCode`: текст переводится клиентом
        по ключу интернализации, а не приходит с сервера (`D-081`).
      required: [seq, kind, chatId]
      properties:
        seq: { type: integer, format: int64, description: Номер в журнале игры (`D-033`) }
        kind: { $ref: '#/components/schemas/MessageKind' }
        messageId: { type: [string, 'null'], format: uuid }
        chatId: { type: string, format: uuid }
        characterId: { type: [string, 'null'], format: uuid }
        authorMembershipId: { type: [string, 'null'], format: uuid }
        authorUserId: { type: [string, 'null'], format: uuid }
        onBehalfOfMaster: { type: boolean }
        hiddenAuthor: { type: boolean, description: 'Скрытность на момент записи (`D-007`)' }
        body: { type: [string, 'null'] }
        systemCode: { type: [string, 'null'], description: 'Ключ интернализации системного события' }
        payload: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
        matchedNoteIds:
          type: array
          description: 'Заметки, подсвечивающие строку, посчитанные при записи (`D-050`)'
          items: { type: string, format: uuid }
    Feed:
      type: object
      required: [items, lastSeq, readSeq, chatKind]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        lastSeq: { type: integer, format: int64, description: Метка продолжения для resume (`D-083`) }
        readSeq: { type: integer, format: int64 }
        chatKind: { type: string, enum: [LOCATION, RADIO, MASTER_DM, WHISPER, FINAL] }
    ChatEntry:
      type: object
      required: [chatId, chatKind, cursor]
      properties:
        chatId: { type: string, format: uuid }
        chatKind: { type: string, enum: [LOCATION, RADIO, MASTER_DM, WHISPER, FINAL] }
        cursor: { type: integer, format: int64, description: Курсор на текущий максимум (`D-032`) }
        lastMessage: { anyOf: [{ $ref: '#/components/schemas/Message' }, { type: 'null' }] }
    ReadRequest:
      type: object
      properties:
        seq: { type: [integer, 'null'], format: int64, description: 'Пусто — до конца чата' }
    ReadCursor:
      type: object
      required: [chatId, subjectKind, subjectId, lastSeq]
      properties:
        chatId: { type: string, format: uuid }
        subjectKind: { type: string, enum: [CHARACTER, MEMBERSHIP] }
        subjectId: { type: string, format: uuid }
        lastSeq: { type: integer, format: int64 }
    Unread:
      type: object
      required: [total, chats]
      properties:
        total: { type: integer, format: int64 }
        chats:
          type: array
          items:
            type: object
            required: [chatId, count]
            properties:
              chatId: { type: string, format: uuid }
              count: { type: integer, format: int64 }
    NoteKeyword:
      type: object
      description: 'Ключ заметки: слово и признак точного совпадения (`D-051`)'
      required: [raw, exactMatch]
      properties:
        id: { type: [string, 'null'], format: uuid }
        raw: { type: string, description: 'Слово как его набрал автор' }
        exactMatch: { type: boolean, description: 'Сравнивать целиком — режим имени (`D-051`)' }
    Note:
      type: object
      description: |
        Заметка тетради (`§15.1`). Цель — пара «вид + идентификатор» (`D-086`) вместе с
        подписью `targetLabel` (`D-127`): подпись и есть маркер владельца при объединении
        заметок нескольких персонажей (`D-053`).
      required: [id, gameId, targetKind, targetId, body]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        authorMembershipId: { type: string, format: uuid }
        targetKind: { type: string, enum: [CHARACTER, MEMBERSHIP] }
        targetId: { type: string, format: uuid }
        targetLabel:
          type: [string, 'null']
          description: |
            Подпись цели — маркер владельца при объединении заметок нескольких персонажей
            (`D-053`). Имя берётся живым (`D-127`); для цели-участия подписи нет.
        body: { type: string, description: 'Текст заметки, до 2000 знаков (`D-098`)' }
        matchingPending:
          type: boolean
          description: 'Подсветка ещё досчитывается (`D-087`)'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        keywords:
          type: array
          items: { $ref: '#/components/schemas/NoteKeyword' }
    NoteRequest:
      type: object
      required: [targetKind, targetId, body]
      properties:
        targetKind: { type: string, enum: [CHARACTER, MEMBERSHIP] }
        targetId: { type: string, format: uuid }
        body: { type: string, description: 'Текст заметки, до 2000 знаков (`D-098`)' }
        keywords:
          type: array
          description: 'До десяти ключей на заметку (`D-098`)'
          items: { $ref: '#/components/schemas/NoteKeyword' }
    SavedMessage:
      type: object
      description: |
        Сохранённое сообщение тетради (`§15.2`). Принадлежит участию (`D-055`), поэтому
        смена персонажа записей не теряет; снимок защищает текст от правки задним числом.
      required: [id, gameId, ownerMembershipId, messageId]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        ownerMembershipId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        textSnapshot: { type: [string, 'null'], description: 'Тело на момент сохранения (`D-055`)' }
        speakerSnapshot: { type: [string, 'null'], description: 'Имя говорящего на момент сохранения' }
        comment: { type: [string, 'null'] }
        noteId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    SaveMessageRequest:
      type: object
      required: [messageId]
      properties:
        messageId: { type: string, format: uuid }
        comment: { type: [string, 'null'] }
        noteId: { type: [string, 'null'], format: uuid }
    CommentRequest:
      type: object
      properties:
        comment: { type: [string, 'null'] }
    RestrictionKind:
      type: string
      description: '`NO_JOKE` адресуется участию, остальные — персонажу (`D-099`)'
      enum: [NO_SPEECH, NO_ACTION, NO_MOVE, NO_JOKE]
    RestrictionRequest:
      type: object
      required: [subjectKind, subjectId, kind, reason]
      properties:
        subjectKind: { type: string, enum: [CHARACTER, MEMBERSHIP] }
        subjectId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RestrictionKind' }
        reason: { type: string, maxLength: 500, description: 'Обязателен: ограничение — ситуация, а не наказание (`D-064`)' }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Срок поддерживается, но не обязателен' }
    Restriction:
      type: object
      required: [id, gameId, subjectKind, subjectId, kind, reason, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        subjectKind: { type: string, enum: [CHARACTER, MEMBERSHIP] }
        subjectId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RestrictionKind' }
        reason: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time, description: 'Снятие — не удаление (`D-010`)' }

    Channel:
      type: object
      required: [id, gameId, kind, title, disabled, archived, createdAt, master, unread, members]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        kind: { type: string, enum: [RADIO, WHISPER, MASTER_DM, FINAL] }
        title: { type: string }
        disabled: { type: boolean, description: 'Отключённый радиочат читается, но не принимает запись (D-039)' }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        mySubjectKind: { type: [string, 'null'], enum: [CHARACTER, MEMBERSHIP, null], description: 'Кем смотрящий состоит в канале; пусто у мастера, который в канал не входил (D-086)' }
        myState: { type: [string, 'null'], enum: [INVITED, JOINED, DECLINED, LEFT, null] }
        master: { type: boolean, description: 'Смотрит мастер: он видит канал, даже если не состоит в нём' }
        unread: { type: integer, format: int64, description: 'Считается по inbox_entry (D-036)' }
        members:
          type: array
          items: { $ref: '#/components/schemas/ChannelMember' }
    ChannelMember:
      type: object
      required: [subjectKind, subjectId, state]
      properties:
        subjectKind: { type: string, enum: [CHARACTER, MEMBERSHIP] }
        subjectId: { type: string, format: uuid }
        state: { type: string, enum: [INVITED, JOINED, DECLINED, LEFT], description: 'Приглашение и согласие — разные состояния (D-038)' }
    RadioRequest:
      type: object
      required: [title, characterIds]
      properties:
        title: { type: string, maxLength: 200 }
        characterIds:
          type: array
          items: { type: string, format: uuid }
    RadioMembersRequest:
      type: object
      required: [characterIds]
      properties:
        characterIds:
          type: array
          items: { type: string, format: uuid }
    RadioDisabledRequest:
      type: object
      required: [disabled]
      properties:
        disabled: { type: boolean }
    WhisperRequest:
      type: object
      required: [characterIds]
      properties:
        characterIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    Membership:
      type: object
      description: |
        Участие пользователя в игре (`REQUIREMENTS §6`). `reservedCharacterId` — слот,
        обещанный приглашением: бронь живёт до согласия и занятостью не является (`D-130`).
        Роль и статус отдаются строками: клиент переводит их по ключам интернализации,
        а не сравнивает с числом (`D-081`).
      required: [id, gameId, userId, role, status]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [MASTER, PLAYER, OBSERVER] }
        status: { type: string, enum: [INVITED, JOINED, DECLINED, LEFT, BANNED] }
        createdAt: { type: [string, 'null'], format: date-time }
        joinedAt: { type: [string, 'null'], format: date-time }
        leftAt: { type: [string, 'null'], format: date-time }
        reservedCharacterId: { type: [string, 'null'], format: uuid }
        roleplayWishes:
          type: [string, 'null']
          description: |
            «Пожелания по отыгрышу» — свободный текст игрока, который мастер читает при
            распределении ролей (`REQUIREMENTS §17`, `D-139`). Не канон: поле живёт на
            участии, а не на карточке, и видно только его автору и мастеру.
    SubmitRequestRequest:
      type: object
      description: |
        Подача заявки (`REQUIREMENTS §17`). `origin` и `type` — строки, а не перечисления:
        неизвестное значение обязано дать адресный машинный код (`D-043`), а не общий отказ
        связывания.
      required: [type]
      properties:
        origin:
          type: string
          enum: [MASTER, PLAYER, LLM]
          default: PLAYER
        type:
          type: string
          enum: [CHARACTER_EDIT, ROLE_REQUEST, SLOT_QUESTION, CO_MASTER, AUTOPILOT]
        toCharacterId: { type: [string, 'null'], format: uuid }
        payload:
          type: object
          description: |
            Change set: список `operations`, каждая с полями `op` и `payload`
            (`contract/changeset.schema.json`). Виды операций — `update_character_field`,
            `create_item`, `move_character`, `post_master_message`,
            `update_storage_contents`, `create_note`, `post_character_message`.
          additionalProperties: true
        idempotencyKey: { type: [string, 'null'], maxLength: 128 }
        expiresAt: { type: [string, 'null'], format: date-time }
    DecisionRequest:
      type: object
      description: |
        Решение по заявке: номера операций, к которым оно относится. Отсутствие тела и
        пустой список — разные вещи: `null` значит «не прислали», пустой список — «ничего»
        (`D-135`).
      properties:
        approve:
          type: [array, 'null']
          items: { type: integer, minimum: 1 }
    LlmStatus:
      type: object
      description: |
        Доступность опций модели (`D-042`). `reason` — машинный код: `llm_not_configured`
        означает «ключ не задан», и клиент прячет панель целиком.
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: [string, 'null'] }
    LlmProposalRequest:
      type: object
      description: |
        Запрос к модели. `type` различает со-мастера и автопилота; `characterId` и `chatId`
        обязательны автопилоту, потому что он играет конкретного персонажа в конкретной
        сцене (`REQUIREMENTS §18`).
      required: [instruction]
      properties:
        type:
          type: string
          enum: [CO_MASTER, AUTOPILOT]
          default: CO_MASTER
        instruction: { type: string, minLength: 1, maxLength: 4000 }
        chatId: { type: [string, 'null'], format: uuid }
        characterId: { type: [string, 'null'], format: uuid }
        idempotencyKey: { type: [string, 'null'], maxLength: 128 }
    Request:
      type: object
      description: |
        Заявка (`REQUIREMENTS §17`, `D-040`). Одна сущность для игрока, мастера и модели;
        различает источники `origin`. Статус заявки — сводка по операциям, а не намерение
        мастера (`D-135`).
      required: [id, gameId, origin, type, status, operations]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        origin: { type: string, enum: [MASTER, PLAYER, LLM] }
        type:
          type: string
          enum: [CHARACTER_EDIT, ROLE_REQUEST, SLOT_QUESTION, CO_MASTER, AUTOPILOT]
        fromMembershipId: { type: [string, 'null'], format: uuid }
        toCharacterId: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, APPROVED, REJECTED, PARTIALLY_APPROVED, EXPIRED]
        error: { type: [string, 'null'] }
        idempotencyKey: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        payload: { type: object, additionalProperties: true }
        operations:
          type: array
          items: { $ref: '#/components/schemas/RequestOperation' }
    RequestOperation:
      type: object
      description: |
        Операция заявки (`D-041`). `ordinal` задаёт порядок применения: операции зависят
        друг от друга, поэтому применяются по возрастанию, а откатываются в обратном
        порядке (`D-137`). `oldValue` — прежнее значение, снятое при применении; откат
        берёт его из журнала (`D-138`).
      required: [id, ordinal, op, status, reversible]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        op:
          type: string
          enum: [update_character_field, create_item, move_character, post_master_message, update_storage_contents, create_note, post_character_message]
        status:
          type: string
          enum: [PENDING, APPLIED, REJECTED, FAILED, ROLLED_BACK]
        reversible:
          type: boolean
          description: |
            Откат возможен. Свойство вида операции, а не её статуса (D-010): создание
            предмета, сообщение и заметка необратимы, потому что удаление запрещено.
        payload: { type: object, additionalProperties: true }
        oldValue: { type: [object, 'null'], additionalProperties: true }

    InvitationRequest:
      type: object
      description: |
        Цель адресуется логином существующего аккаунта (`D-131`): несуществующий логин
        отвергается до всякой записи, поэтому в теле нет идентификатора, который клиент
        мог бы выдумать.
      required: [login]
      properties:
        login: { type: string, maxLength: 64 }
        role: { type: [string, 'null'], enum: [PLAYER, OBSERVER] }
        characterId: { type: [string, 'null'], format: uuid }
    MemberLoginRequest:
      type: object
      description: Адресация участия логином для бана и снятия бана (`D-133`).
      required: [login]
      properties:
        login: { type: string, maxLength: 64 }
    CharacterMoveRequest:
      type: object
      description: |
        В теле только переход: направление берётся у ребра, а не у клиента, иначе игрок
        указал бы «откуда» и проверка «вы стоите именно там» обходилась бы.
      required: [transitionId]
      properties:
        transitionId: { type: string, format: uuid }
