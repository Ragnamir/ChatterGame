# Каркас модели данных (E01). Все таблицы создаются сразу, чтобы проверить, что модель
# помещается, до появления кода. Применённый файл не редактируется никогда: изменения —
# только новым changes/<NNN>-<stage>.yaml.
#
# UUIDv7 как внешний PK выдаёт приложение, а не БД: функция uuidv7() есть только с
# PostgreSQL 18, стек зафиксирован на PostgreSQL 16.
databaseChangeLog:

  - changeSet:
      id: 001-01-app-user
      author: e01
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_app_user } }
              - column: { name: login, type: varchar(64), constraints: { nullable: false } }
              - column: { name: login_normalized, type: varchar(64), constraints: { nullable: false } }
              - column: { name: display_name, type: varchar(128), constraints: { nullable: false } }
              - column: { name: email, type: varchar(320) }
              - column: { name: email_verified_at, type: timestamptz }
              - column: { name: avatar_asset_id, type: uuid }
              - column: { name: theme, type: varchar(16), defaultValue: system, constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: app_user
            indexName: ux_app_user_login_normalized
            unique: true
            columns:
              - column: { name: login_normalized }
        - sql:
            sql: CREATE UNIQUE INDEX ux_app_user_email ON app_user (email) WHERE email IS NOT NULL
            rollback: DROP INDEX ux_app_user_email

  - changeSet:
      id: 001-02-auth-identity
      author: e01
      changes:
        - createTable:
            tableName: auth_identity
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_auth_identity } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: provider, type: varchar(16), constraints: { nullable: false } }
              - column: { name: provider_user_id, type: varchar(255) }
              - column: { name: email, type: varchar(320) }
              - column: { name: secret_hash, type: varchar(255) }
              - column: { name: verified_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: auth_identity
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_auth_identity_user
        - createIndex:
            tableName: auth_identity
            indexName: ux_auth_identity_provider_user
            unique: true
            columns:
              - column: { name: provider }
              - column: { name: provider_user_id }
        - createIndex:
            tableName: auth_identity
            indexName: ix_auth_identity_user
            columns:
              - column: { name: user_id }

