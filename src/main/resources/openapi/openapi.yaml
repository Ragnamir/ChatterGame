openapi: 3.1.0
info:
  title: ChatterGame API
  version: 0.1.0
  description: |
    Контур API. На E02 зафиксированы пользователь и локальная аутентификация: регистрация,
    вход, сессия в HttpOnly cookie, профиль, сброс пароля, ключи LLM и удаление аккаунта.
    На E03 добавлены игры: создание, чтение, переходы состояния и аудит-чтение журнала.
    Пути идут без префикса `/api`: так они записаны в `PLAN` (`GET /me`, `GET /games/{id}/events`).

    Состояние игры отдаётся тремя отдельными полями (`readiness`, `visibility`, `phase`)
    плюс `paused`: это независимые оси (`D-003`), а не одно значение.

    Ошибки отдаются в формате `ProblemDetail`; машинный код лежит в свойстве `code`,
    потому что текст переводится по ключу интернализации (`D-081`).

    Любое изменение файла требует обновления снапшота
    `src/test/resources/contract/openapi.snapshot.yaml`, иначе гейт краснеет.
servers:
  - url: /
paths:
  /games:
    post:
      summary: Создание игры мастером
      description: |
        Создатель становится мастером и участником со статусом `JOINED`. Игра рождается
        в состоянии `DRAFT`/`PRIVATE`/`NOT_STARTED` — это значения по умолчанию колонок в
        `001-baseline.yaml`. Оси независимы (`D-003`).
      operationId: createGame
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameRequest' }
      responses:
        '201':
          description: Игра создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: Игры, где пользователь мастер или участник
      operationId: listMyGames
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Список игр
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Игра по идентификатору
      operationId: getGame
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Игра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Правка названия, описаний и видимости
      description: После `FINISHED` правка описаний запрещена (`D-094`).
      operationId: updateGame
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGameRequest' }
      responses:
        '200':
          description: Игра после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Переходы, доступные из текущего состояния
      description: Клиент показывает кнопки по этому ответу, а не по своей копии правил.
      operationId: listGameTransitions
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Доступные переходы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Переход состояния игры
      description: |
        Отказ несёт машинный код и текст причины (`REQUIREMENTS §4`). Пауза требует причину;
        без неё переход отклоняется (`D-059`).
      operationId: applyGameTransition
      tags: [game]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200':
          description: Игра после перехода
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Переход запрещён из текущего состояния
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/readiness:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Валидация готовности игры
      description: |
        Блокирующие замечания запрещают `DRAFT → READY`, предупреждающие не мешают:
        флаг готовности остаётся за мастером (`REQUIREMENTS §20`).
      operationId: getGameReadiness
      tags: [game]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Отчёт валидации
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/events:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Аудит-чтение журнала игры
      description: |
        Страница по возрастанию `seq` с курсором `after` и фильтром по типу. Курсор, а не
        `offset`: журнал растёт, и смещение пропускало бы и повторяло строки (`D-082`).
      operationId: listGameEvents
      tags: [game]
      security:
        - sessionCookie: []
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: type
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: События в порядке игрового номера
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/locations:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание локации мастером
      description: |
        Локация — узел графа (`REQUIREMENTS §7.1`). Удаление не предусмотрено ни до, ни после
        `READY` (`D-010`, `D-103`): только архивация с причиной.
      operationId: createLocation
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationRequest' }
      responses:
        '201':
          description: Локация создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Локации игры глазами запросившего
      description: |
        Архивная локация до `READY` игроку не отдаётся вовсе, после `READY` приходит с
        признаком и причиной (`D-009`).
      operationId: listLocations
      tags: [chat]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Локации
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GraphNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/locations/{chatId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    patch:
      summary: Правка названия и описания локации
      description: После `FINISHED` правка мира запрещена (`D-094`).
      operationId: updateLocation
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationRequest' }
      responses:
        '200':
          description: Локация после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление локации запрещено всегда
      description: |
        Физического удаления нет ни до, ни после `READY` (`D-010`, `D-103`). Ответ всегда
        `409` с машинным кодом и причиной; до `READY` текст причины подсказывает архивацию.
      operationId: deleteLocation
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Удаление не предусмотрено, используйте архивацию
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/locations/{chatId}/archive:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    post:
      summary: Архивирование локации с причиной
      description: Идемпотентно: повторный вызов не пишет второе событие.
      operationId: archiveLocation
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Локация в архиве
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/locations/{chatId}/image:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ChatId'
    put:
      summary: Установка или снятие картинки локации
      description: |
        `assetId: null` снимает картинку: удаляется ссылка, а не ассет (`D-077`, `D-106`).
        Ассет обязан принадлежать этой же игре; прежняя картинка освобождается, если на неё
        больше никто не ссылается.
      operationId: setLocationImage
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationImageRequest' }
      responses:
        '200':
          description: Локация после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/graph:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Граф локаций глазами запросившего
      description: |
        Без `asCharacter` полный граф, включая архивные рёбра, видит только мастер. С
        `asCharacter` рёбра отбираются по знанию указанного персонажа; игрок обязан смотреть
        своим персонажем (`REQUIREMENTS §8`, `D-103`).
      operationId: getGameGraph
      tags: [chat]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Узлы и рёбра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameGraph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/graph/transitions:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Создание ориентированного перехода
      description: |
        Направление явное; симметричность задаётся двумя рёбрами (`REQUIREMENTS §8`).
        Переход архивируется с причиной, закрытие делается состоянием у персонажа.
      operationId: createTransition
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransitionRequest' }
      responses:
        '201':
          description: Переход создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Рёбра графа глазами запросившего
      operationId: listGraphTransitions
      tags: [chat]
      security:
        - sessionCookie: []
      parameters:
        - name: asCharacter
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Рёбра
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GraphEdge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games/{id}/graph/transitions/{transitionId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TransitionId'
    patch:
      summary: Переименование перехода
      operationId: renameTransition
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameTransitionRequest' }
      responses:
        '200':
          description: Переход после правки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление перехода запрещено всегда
      operationId: deleteTransition
      tags: [chat]
      security:
        - sessionCookie: []
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Удаление не предусмотрено, используйте архивацию
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /games/{id}/graph/transitions/{transitionId}/archive:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TransitionId'
    post:
      summary: Архивирование перехода с причиной
      operationId: archiveTransition
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Переход в архиве
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/graph/transitions/{transitionId}/state:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/TransitionId'
    put:
      summary: Состояние ребра для персонажа
      description: |
        Мастер ведёт знание ребра по каждому персонажу осознанно (`D-103`). Для
        `KNOWN_UNAVAILABLE` причина обязательна: именно её видит игрок. Идемпотентно.
      operationId: setTransitionState
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeStateRequest' }
      responses:
        '200':
          description: Состояние сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/characters:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Заведение персонажа мастером
      description: |
        На `E04` заводится минимальный персонаж — без него нельзя привязать знание ребра
        (`D-103`). Портрет, истории, занятость и скрытность — `E06`.
      operationId: registerCharacter
      tags: [chat]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterRequest' }
      responses:
        '201':
          description: Персонаж создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /games/{id}/assets:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      summary: Загрузка медиа-ассета мастером
      description: |
        Формат определяется по содержимому, не по расширению (`D-074`): whitelist
        `jpeg, png, webp, gif`, отдельные отказы на SVG и HTML. Сторона проверяется по
        заголовку до декодирования (`D-076`), метаданные вырезаются при записи (`D-077`).
        Загрузка ассета ещё не мутирует мир: событие в журнале появляется при привязке.
      operationId: uploadAsset
      tags: [media]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Ассет принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /games/{id}/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/AssetId'
    get:
      summary: Отдача медиа-ассета
      description: |
        Отдаётся приложением, а не веб-сервером: проверка участия стоит на каждом запросе
        (`D-075`). Посторонний получает `404`, а не `403`, — иначе код ответа выдал бы
        существование чужой игры. Отдача идёт с `nosniff`, точным `Content-Type` и долгим
        `Cache-Control` с идентификатором в URL (`D-077`).
      operationId: readAsset
      tags: [media]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Содержимое ассета
          headers:
            Cache-Control:
              description: Долгий кэш; идентификатор ассета неперечислим и неизменяем
              schema: { type: string }
            X-Content-Type-Options:
              description: Всегда `nosniff`
              schema: { type: string }
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/gif: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Ассета нет, он из другой игры или нет участия
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/register:
    post:
      summary: Открытая регистрация по логину и паролю
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Аккаунт создан, сессия выдана cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      summary: Вход по логину и паролю
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вход выполнен, сессия выдана cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Выход на текущем устройстве
      operationId: logout
      tags: [auth]
      responses:
        '204':
          description: Сессия отозвана, cookie снята
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
  /auth/logout-all:
    post:
      summary: Выход на всех устройствах
      operationId: logoutAll
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Все сессии пользователя отозваны
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      summary: Текущий пользователь
      operationId: getMe
      tags: [profile]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Обновление отображаемого имени, почты и темы
      operationId: updateMe
      tags: [profile]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Профиль после обновления
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Удаление аккаунта с анонимизацией PII
      operationId: deleteMe
      tags: [profile]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Вход заблокирован, PII анонимизированы, сессии удалены
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/password:
    post:
      summary: Смена пароля
      description: Инвалидирует все сессии, включая текущую (`D-096`).
      operationId: changePassword
      tags: [profile]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Пароль изменён, сессии отозваны
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/password/reset:
    post:
      summary: Запрос письма для сброса пароля
      description: |
        Ответ одинаков для существующего и несуществующего адреса (`D-079`).
      operationId: requestPasswordReset
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Письмо отправлено, если адрес существует
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/password/reset/confirm:
    post:
      summary: Установка нового пароля по токену из письма
      operationId: confirmPasswordReset
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordConfirmRequest' }
      responses:
        '204':
          description: Пароль установлен, все сессии отозваны
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/llm-credentials:
    get:
      summary: Ключи LLM пользователя
      description: Секрет не возвращается ни в каком виде (`D-093`).
      operationId: listLlmCredentials
      tags: [llm]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Ключи без секретов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LlmCredentialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Добавление ключа LLM
      operationId: createLlmCredential
      tags: [llm]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialRequest' }
      responses:
        '201':
          description: Ключ сохранён зашифрованным, активным не становится
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmCredentialView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/llm-credentials/{id}/activate:
    post:
      summary: Сделать ключ активным
      description: Активный ключ у пользователя ровно один.
      operationId: activateLlmCredential
      tags: [llm]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Ключ активен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmCredentialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/llm-credentials/{id}:
    delete:
      summary: Удаление ключа LLM
      operationId: deleteLlmCredential
      tags: [llm]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '204':
          description: Ключ удалён
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CHATTERGAME_SESSION
  parameters:
    CredentialId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransitionId:
      name: transitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    SessionCookie:
      description: HttpOnly, SameSite=Lax, срок 30 дней
      schema: { type: string }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Требуется вход или неверные креденшалы
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Нет доступа к игре или нет права на действие
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Логин или почта уже заняты
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Превышен лимит частоты запросов
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: Ошибка в формате ProblemDetail с машинным кодом в поле `code`.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    UserProfile:
      type: object
      required: [id, login, displayName, theme, emailVerified]
      properties:
        id: { type: string, format: uuid }
        login: { type: string, description: Отображаемая форма, регистр сохранён }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        avatarAssetId: { type: [string, 'null'], format: uuid }
        theme: { type: string, enum: [system, light, dark] }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, maxLength: 64, description: NFC-нормализация на сервере }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: [string, 'null'], maxLength: 128 }
        email: { type: [string, 'null'], maxLength: 320 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: [string, 'null'], maxLength: 128 }
        email: { type: [string, 'null'], maxLength: 320 }
        theme: { type: [string, 'null'], enum: [system, light, dark, 'null'] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 320 }
    ResetPasswordConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
    LlmCredentialView:
      type: object
      description: Секрет отсутствует в схеме целиком (`D-093`).
      required: [id, baseUrl, model, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, 'null'], maxLength: 64 }
        baseUrl: { type: string }
        model: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateCredentialRequest:
      type: object
      required: [baseUrl, model, secret]
      properties:
        label: { type: [string, 'null'], maxLength: 64 }
        baseUrl: { type: string, maxLength: 255 }
        model: { type: string, maxLength: 128 }
        secret: { type: string, description: Пишется только сюда, обратно не возвращается }
    Game:
      type: object
      description: |
        Состояние игры — три независимые оси (`D-003`) плюс флаг паузы (`D-059`).
        `readOnly` вычисляется сервером: после `FINISHED` мир доступен только на чтение (`D-094`).
      required: [id, masterUserId, title, readiness, visibility, phase, paused, turnBased, archived, readOnly]
      properties:
        id: { type: string, format: uuid }
        masterUserId: { type: string, format: uuid, description: Мастерство не передаётся (`D-021`) }
        title: { type: string, maxLength: 200 }
        publicDescription: { type: [string, 'null'] }
        privateDescription: { type: [string, 'null'], description: Видно мастеру и участникам с правом чтения }
        readiness: { type: string, enum: [DRAFT, READY] }
        visibility: { type: string, enum: [PRIVATE, PUBLIC] }
        phase: { type: string, enum: [NOT_STARTED, RUNNING, FINISHED] }
        paused: { type: boolean }
        pauseReason: { type: [string, 'null'] }
        turnBased: { type: boolean }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        readOnly: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGameRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        publicDescription: { type: [string, 'null'] }
        privateDescription: { type: [string, 'null'] }
    UpdateGameRequest:
      type: object
      description: Отсутствующее поле означает «не трогать»; `PATCH`, а не `PUT`.
      properties:
        title: { type: [string, 'null'], maxLength: 200 }
        publicDescription: { type: [string, 'null'] }
        privateDescription: { type: [string, 'null'] }
        visibility: { type: [string, 'null'], enum: [PRIVATE, PUBLIC, 'null'] }
    TransitionRequest:
      type: object
      required: [transition]
      properties:
        transition: { type: string, enum: [MARK_READY, RETURN_TO_DRAFT, START, PAUSE, RESUME, FINISH] }
        pauseReason: { type: [string, 'null'], description: Обязателен для `PAUSE` (`D-059`) }
    TransitionList:
      type: object
      required: [transitions]
      properties:
        transitions:
          type: array
          items:
            type: object
            required: [transition, reason]
            properties:
              transition: { type: string }
              reason: { type: string, description: Текст для мастера, не контракт (`D-081`) }
    ReadinessReport:
      type: object
      description: Блокирующие замечания запрещают `DRAFT → READY`, предупреждающие — нет (`REQUIREMENTS §20`).
      required: [blocking, warning]
      properties:
        blocking:
          type: array
          items: { $ref: '#/components/schemas/ReadinessFinding' }
        warning:
          type: array
          items: { $ref: '#/components/schemas/ReadinessFinding' }
    ReadinessFinding:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    GameEvent:
      type: object
      description: |
        Запись журнала. `seq` непрерывен в пределах игры и выдаётся под блокировкой счётчика
        (`D-033`); состав типов зафиксирован в `contract/events.schema.json`.
      required: [id, seq, type, onBehalfOfMaster, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        type: { type: string }
        chatId: { type: [string, 'null'], format: uuid }
        actorUserId: { type: [string, 'null'], format: uuid }
        characterId: { type: [string, 'null'], format: uuid }
        onBehalfOfMaster: { type: boolean }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
    LocationRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
    Location:
      type: object
      description: |
        Локация (`REQUIREMENTS §7.1`). `archived` и `archivedReason` — отдельные поля:
        клиент показывает «выведено из игры» с причиной (`D-009`).
      required: [id, gameId, kind, title, archived, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        kind: { type: string, enum: [LOCATION] }
        title: { type: string }
        description: { type: [string, 'null'] }
        imageAssetId: { type: [string, 'null'], format: uuid, description: Картинка локации, одна на сущность (`D-098`) }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    LocationImageRequest:
      type: object
      description: Пустая ссылка снимает картинку; удаления ассета здесь нет (`D-077`).
      properties:
        assetId: { type: [string, 'null'], format: uuid }
    Asset:
      type: object
      description: |
        Метаданные ассета (`REQUIREMENTS §19`). Ключа хранилища в контракте нет: клиент
        ходит по `/assets/{id}`, и переезд на объектное хранилище контракт не меняет.
      required: [id, gameId, mime, byteSize, width, height, sha256, createdAt]
      properties:
        id: { type: string, format: uuid, description: Неперечислимый идентификатор (`D-075`) }
        gameId: { type: string, format: uuid }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
        byteSize: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sha256: { type: string, description: Хеш содержимого после вырезания метаданных (`D-077`) }
        originalName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ArchiveRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    CreateTransitionRequest:
      type: object
      required: [fromChatId, toChatId]
      properties:
        fromChatId: { type: string, format: uuid }
        toChatId: { type: string, format: uuid }
        title: { type: [string, 'null'], maxLength: 200 }
    RenameTransitionRequest:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 200 }
    Transition:
      type: object
      required: [id, gameId, fromChatId, toChatId, archived, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        fromChatId: { type: string, format: uuid }
        toChatId: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    EdgeStateRequest:
      type: object
      required: [characterId, state]
      properties:
        characterId: { type: string, format: uuid }
        state: { type: string, enum: [UNKNOWN, KNOWN_UNAVAILABLE, AVAILABLE] }
        reason: { type: [string, 'null'], maxLength: 500 }
    EdgeState:
      type: object
      required: [transitionId, characterId, state]
      properties:
        transitionId: { type: string, format: uuid }
        characterId: { type: string, format: uuid }
        state: { type: string, enum: [UNKNOWN, KNOWN_UNAVAILABLE, AVAILABLE] }
        reason: { type: string }
    CharacterRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
    Character:
      type: object
      required: [id, gameId, name]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        name: { type: string }
    GraphNode:
      type: object
      required: [id, title, archived]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
    GraphEdge:
      type: object
      description: |
        Ребро глазами смотрящего. `state` — знание конкретного персонажа
        (`REQUIREMENTS §8`); у мастера без `asCharacter` он `null`. Рёбра в состоянии
        `UNKNOWN` в ответ не попадают.
      required: [id, fromChatId, toChatId]
      properties:
        id: { type: string, format: uuid }
        fromChatId: { type: string, format: uuid }
        toChatId: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedReason: { type: [string, 'null'] }
        state: { type: [string, 'null'], enum: [UNKNOWN, KNOWN_UNAVAILABLE, AVAILABLE, 'null'] }
        reason: { type: [string, 'null'] }
    GameGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
